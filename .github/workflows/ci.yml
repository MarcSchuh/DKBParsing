name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  UV_VERSION: "latest"

jobs:
  # Note: the job name including the matrix suffix ("lint-and-test (3.13)")
  # is a required status check in the repository ruleset — keep it in sync.
  # Do not set a "name:" property: it would change the check-run name.
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Run Ruff linter
        run: uv run ruff check src/ tests/

      - name: Run Ruff formatter check
        run: uv run ruff format --check src/ tests/

      - name: Run MyPy type checking
        run: uv run mypy --config-file pyproject.toml src/

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          python-version: "3.13"
          uv-version: ${{ env.UV_VERSION }}

      - name: Run Bandit
        run: uv run bandit -r src/ --severity-level medium

      - name: Run pip-audit
        run: uv run pip-audit
