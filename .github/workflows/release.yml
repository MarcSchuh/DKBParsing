name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize release runs: rapid successive merges otherwise race when
# creating the same tag, and the first run tags a commit that is no
# longer the branch head (which the Actions bot may not push).
concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  UV_VERSION: "latest"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Always release the latest main, not the (possibly outdated)
      # commit that triggered this run. Tagging a stale commit whose
      # workflow files differ from the current branch head makes GitHub
      # reject the tag push: "refusing to allow a GitHub App to create
      # or update workflow ...".
      - name: Fast-forward to latest main
        run: |
          git fetch origin
          git reset --hard origin/main
          echo "Releasing commit: $(git log -1 --oneline)"

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          python-version: "3.13"
          uv-version: ${{ env.UV_VERSION }}

      - name: Extract version from pyproject.toml
        id: get-version
        run: |
          VERSION=$(grep -E '^version\s*=' pyproject.toml | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Build executable
        run: |
          chmod +x scripts/*.sh
          ./scripts/build_dkbparsing.sh

      - name: Verify build
        run: |
          echo "Checking built executable..."
          ls -lh dist/
          if [ ! -f "dist/dkbparsing" ]; then
            echo "❌ Missing executable: dist/dkbparsing"
            exit 1
          fi
          echo "✅ dkbparsing: $(du -h dist/dkbparsing | cut -f1)"

      - name: Create release tag if it doesn't exist
        id: create-tag
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Creating new tag: $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.create-tag.outputs.tag }}
          name: Release ${{ steps.create-tag.outputs.tag }}
          body: |
            ## Release ${{ steps.create-tag.outputs.tag }}

            This release includes the standalone `dkbparsing` executable.

            ### Installation
            Download the executable and make it executable:
            ```bash
            chmod +x dkbparsing
            ```

            ### Usage
            ```bash
            ./dkbparsing /path/to/accounting.csv --config /path/to/cli_config.json
            ```

            See the README for detailed usage instructions.
          files: |
            dist/dkbparsing
          draft: false
          prerelease: false
