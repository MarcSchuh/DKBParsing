// apt-ftparchive configuration for the DKBParsing repository
// Used by .github/workflows/apt-repo.yml to generate the Release file.
APT::FTPArchive::Release {
    Origin "DKBParsing";
    Label "DKBParsing";
    Suite "stable";
    Codename "stable";
    Architectures "amd64";
    Components "main";
    Description "apt repository for DKBParsing - parsing and categorizing of DKB account statement CSV exports";
};
